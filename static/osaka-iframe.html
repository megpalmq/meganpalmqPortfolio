<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Osaka 2036 Mockup</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(241, 162, 79, 0.35),
            transparent 34%
          ),
          linear-gradient(145deg, #2e0938, #573a68 55%, #f1a24f 140%);
        color: #fff;
      }

      .frame {
        box-sizing: border-box;
        width: 112%;
        height: 112%;
        display: grid;
        gap: 18px;
        background-size: contain;
        align-content: start;
        transform: scale(1.12);
        transform-origin: top left;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.06)),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.04) 0,
            rgba(255, 255, 255, 0.04) 10px,
            rgba(255, 255, 255, 0.02) 10px,
            rgba(255, 255, 255, 0.02) 20px
          );
      }

      .badge {
        width: fit-content;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.28);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 7vw, 76px);
        line-height: 0.94;
        max-width: 7ch;
      }

      p {
        margin: 0;
        max-width: 52ch;
        font-size: 20px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
      }

      .panel {
        margin-top: 8px;
        padding: 26px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .panel strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .panel ul {
        margin: 0;
        padding-left: 20px;
        line-height: 1.75;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="badge">Osaka 2036</div>
      <h1>Website mockup</h1>
      <p>
        A supporting iframe layout for the Osaka branding project, shown here as
        a clean website concept panel.
      </p>
      <section class="panel" aria-label="Mockup details">
        <strong>Project system</strong>
        <ul>
          <li>Brand-led landing page layout</li>
          <li>Olympic identity colors and typography</li>
          <li>Flexible space for posters, tickets, and supporting graphics</li>
        </ul>
      </section>
    </main>
  </body>
</html>
